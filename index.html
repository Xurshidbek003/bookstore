
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitobxon | Online Book Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f7f5f0;
            --card: #ffffff;
            --text: #20231f;
            --accent: #e66b45;
            --green: #284b3c;
            --muted: #777;
        }

        body.dark {
            --bg: #151916;
            --card: #202722;
            --text: #f1f2eb;
            --green: #b9d0bf;
            --muted: #a5afa5;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            transition: .3s;
        }

        header {
            background: var(--card);
            padding: 20px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 15px #0000000a;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: var(--green);
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text);
            font-weight: bold;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .hero {
            margin: 35px 7%;
            padding: 60px;
            border-radius: 25px;
            background: var(--green);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            line-height: 1.7;
            max-width: 500px;
        }

        .hero button {
            margin-top: 25px;
            background: white;
            color: #20231f;
            font-weight: bold;
        }

        .hero-art {
            font-size: 110px;
        }

        .section {
            padding: 30px 7%;
        }

        .section h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .tools {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input, select {
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
        }

        input {
            flex: 1;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .category {
            background: var(--card);
            color: var(--text);
            border: 1px solid #ddd;
        }

        .category.active {
            background: var(--green);
            color: white;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .book {
            background: var(--card);
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 5px 20px #0000000a;
            transition: .3s;
        }

        .book:hover {
            transform: translateY(-6px);
        }

        .cover {
            height: 220px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 25px;
            font-weight: bold;
        }

        .book h3 {
            margin-top: 15px;
            margin-bottom: 7px;
        }

        .book p {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .price {
            font-weight: bold;
            color: var(--accent);
        }

        .book-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .add {
            background: var(--green);
            color: white;
        }

        .like {
            background: transparent;
            font-size: 22px;
            color: var(--muted);
        }

        .like.active {
            color: #e4545f;
        }

        .cart-panel {
            position: fixed;
            right: -450px;
            top: 0;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: var(--card);
            z-index: 30;
            padding: 25px;
            transition: .3s;
            overflow-y: auto;
        }

        .cart-panel.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #8884;
            gap: 10px;
        }

        .cart-item button {
            background: #e66b45;
            color: white;
        }

        .total {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            z-index: 20;
        }

        .overlay.show {
            display: block;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: var(--card);
            color: var(--muted);
            margin-top: 50px;
        }

        @media(max-width: 900px) {
            .books {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h1 {
                font-size: 35px;
            }
        }

        @media(max-width: 600px) {
            header {
                padding: 15px;
            }

            nav {
                display: none;
            }

            .hero {
                margin: 20px 15px;
                padding: 30px;
            }

            .hero-art {
                display: none;
            }

            .hero h1 {
                font-size: 32px;
            }

            .section {
                padding: 20px 15px;
            }

            .books {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .cover {
                height: 170px;
                font-size: 18px;
            }

            .tools {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">📚 Kitobxon.</div>

    <nav>
        <a href="#">Bosh sahifa</a>
        <a href="#books">Kitoblar</a>
    </nav>

    <div>
        <button onclick="toggleTheme()">🌙</button>
        <button onclick="showFavorites()">❤️ <span id="likeCount">0</span></button>
        <button onclick="openCart()">🛒 <span id="cartCount">0</span></button>
    </div>
</header>

<section class="hero">
    <div>
        <h1>Har bir kitob — yangi bir hayot.</h1>
        <p>
            Sevimli kitoblaringiz, bestsellerlar va
            foydali bilimlar barchasi bir joyda.
        </p>
        <button onclick="location.href='#books'">
            Kitoblarni ko'rish →
        </button>
    </div>

    <div class="hero-art">📖</div>
</section>

<section class="section" id="books">
    <h2>Kitoblar olami</h2>

    <div class="tools">
        <input
            type="text"
            id="search"
            placeholder="Kitob nomini qidiring..."
            oninput="renderBooks()"
        >

        <select id="sort" onchange="renderBooks()">
            <option value="default">Saralash</option>
            <option value="cheap">Arzonlari</option>
            <option value="expensive">Qimmatlari</option>
        </select>
    </div>

    <div class="categories">
        <button class="category active" onclick="filterBooks('Barchasi', this)">Barchasi</button>
        <button class="category" onclick="filterBooks('Badiiy', this)">Badiiy</button>
        <button class="category" onclick="filterBooks('Biznes', this)">Biznes</button>
        <button class="category" onclick="filterBooks('Dasturlash', this)">Dasturlash</button>
        <button class="category" onclick="filterBooks('Tarix', this)">Tarix</button>
    </div>

    <div class="books" id="bookList"></div>
</section>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart-panel" id="cart">
    <div class="cart-header">
        <h2>🛒 Savatcha</h2>
        <button onclick="closeCart()">✖</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
        Jami: <span id="total">0</span> so'm
    </div>
</div>

<footer>
    © 2025 Kitobxon. Barcha huquqlar himoyalangan.
</footer>

<script>
    const books = [
        {
            id: 1,
            name: "O'tkan kunlar",
            author: "Abdulla Qodiriy",
            category: "Badiiy",
            price: 45000,
            color: "#853b45"
        },
        {
            id: 2,
            name: "Atomic Habits",
            author: "James Clear",
            category: "Badiiy",
            price: 89000,
            color: "#c69a36"
        },
        {
            id: 3,
            name: "Sapiens",
            author: "Yuval Noah Harari",
            category: "Tarix",
            price: 110000,
            color: "#315a70"
        },
        {
            id: 4,
            name: "Clean Code",
            author: "Robert Martin",
            category: "Dasturlash",
            price: 135000,
            color: "#343f50"
        },
        {
            id: 5,
            name: "Boy ota, kambag'al ota",
            author: "Robert Kiyosaki",
            category: "Biznes",
            price: 65000,
            color: "#36715a"
        },
        {
            id: 6,
            name: "Mehrobdan chayon",
            author: "Abdulla Qodiriy",
            category: "Badiiy",
            price: 42000,
            color: "#a55f37"
        },
        {
            id: 7,
            name: "Deep Work",
            author: "Cal Newport",
            category: "Biznes",
            price: 78000,
            color: "#555b91"
        },
        {
            id: 8,
            name: "Python Crash Course",
            author: "Eric Matthes",
            category: "Dasturlash",
            price: 125000,
            color: "#28647c"
        }
    ];

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    let currentCategory = "Barchasi";
    let favoritesOnly = false;

    function saveData() {
        localStorage.setItem("cart", JSON.stringify(cart));
        localStorage.setItem("favorites", JSON.stringify(favorites));
        updateCounts();
    }

    function updateCounts() {
        document.getElementById("cartCount").textContent =
            cart.reduce((sum, item) => sum + item.qty, 0);

        document.getElementById("likeCount").textContent =
            favorites.length;
    }

    function renderBooks() {
        const search = document.getElementById("search").value.toLowerCase();

        let result = books.filter(book => {
            const categoryMatch =
                currentCategory === "Barchasi" ||
                book.category === currentCategory;

            const searchMatch =
                book.name.toLowerCase().includes(search) ||
                book.author.toLowerCase().includes(search);

            const favoriteMatch =
                !favoritesOnly || favorites.includes(book.id);

            return categoryMatch && searchMatch && favoriteMatch;
        });

        const sort = document.getElementById("sort").value;

        if (sort === "cheap") {
            result.sort((a, b) => a.price - b.price);
        }

        if (sort === "expensive") {
            result.sort((a, b) => b.price - a.price);
        }

        const container = document.getElementById("bookList");

        container.innerHTML = result.map(book => `
            <div class="book">
                <div class="cover" style="background:${book.color}">
                    ${book.name}
                </div>

                <h3>${book.name}</h3>
                <p>${book.author}</p>
                <p>${book.category}</p>

                <div class="book-actions">
                    <span class="price">
                        ${book.price.toLocaleString("uz-UZ")} so'm
                    </span>

                    <button
                        class="like ${favorites.includes(book.id) ? "active" : ""}"
                        onclick="toggleLike(${book.id})">
                        ${favorites.includes(book.id) ? "♥" : "♡"}
                    </button>

                    <button class="add" onclick="addToCart(${book.id})">
                        + Savat
                    </button>
                </div>
            </div>
        `).join("");

        if (result.length === 0) {
            container.innerHTML = "<p>Kitob topilmadi.</p>";
        }
    }

    function filterBooks(category, button) {
        currentCategory = category;
        favoritesOnly = false;

        document.querySelectorAll(".category").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        renderBooks();
    }

    function toggleLike(id) {
        if (favorites.includes(id)) {
            favorites = favorites.filter(item => item !== id);
        } else {
            favorites.push(id);
        }

        saveData();
        renderBooks();
    }

    function showFavorites() {
        favoritesOnly = !favoritesOnly;
        currentCategory = "Barchasi";

        document.querySelectorAll(".category").forEach(btn => {
            btn.classList.toggle(
                "active",
                btn.textContent === "Barchasi"
            );
        });

        renderBooks();
    }

    function addToCart(id) {
        const item = cart.find(book => book.id === id);

        if (item) {
            item.qty++;
        } else {
            cart.push({ id: id, qty: 1 });
        }

        saveData();
        renderCart();
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        saveData();
        renderCart();
    }

    function changeQuantity(id, amount) {
        const item = cart.find(book => book.id === id);

        if (!item) return;

        item.qty += amount;

        if (item.qty <= 0) {
            removeFromCart(id);
        } else {
            saveData();
            renderCart();
        }
    }

    function renderCart() {
        const container = document.getElementById("cartItems");

        let total = 0;

        container.innerHTML = cart.map(item => {
            const book = books.find(b => b.id === item.id);
            const subtotal = book.price * item.qty;

            total += subtotal;

            return `
                <div class="cart-item">
                    <div>
                        <strong>${book.name}</strong>
                        <p>${book.price.toLocaleString("uz-UZ")} so'm</p>

                        <button onclick="changeQuantity(${book.id}, -1)">−</button>
                        ${item.qty}
                        <button onclick="changeQuantity(${book.id}, 1)">+</button>
                    </div>

                    <button onclick="removeFromCart(${book.id})">
                        O'chirish
                    </button>
                </div>
            `;
        }).join("");

        if (cart.length === 0) {
            container.innerHTML = "<p>Savatcha bo'sh.</p>";
        }

        document.getElementById("total").textContent =
            total.toLocaleString("uz-UZ");
    }

    function openCart() {
        document.getElementById("cart").classList.add("open");
        document.getElementById("overlay").classList.add("show");
    }

    function closeCart() {
        document.getElementById("cart").classList.remove("open");
        document.getElementById("overlay").classList.remove("show");
    }

    function toggleTheme() {
        document.body.classList.toggle("dark");

        const theme = document.body.classList.contains("dark")
            ? "dark"
            : "light";

        localStorage.setItem("theme", theme);
    }

    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
    }

    renderBooks();
    renderCart();
    updateCounts();
</script>

</body>
</html>
